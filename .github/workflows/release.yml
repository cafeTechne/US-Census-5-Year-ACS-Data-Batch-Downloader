# SPDX-License-Identifier: AGPL-3.0-or-later
# Build the sdist and wheel for a version tag and publish a GitHub release.
# Zenodo archives each published release (enabled by the owner in Zenodo's
# GitHub settings) and mints its DOI; see CHANGELOG.md "Releasing".
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches census.__version__
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('census/__init__.py').read()).group(1))")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - name: Mandatory verification checks on the tagged revision
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q tests/test_proposition_verification.py tests/test_verification_contract.py tests/test_workflows_verification.py tests/test_verification_release.py --junitxml=verification-results.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("verification-results.xml").getroot()
          suites = list(root.iter("testsuite"))
          assert sum(int(s.get("tests", 0)) for s in suites) > 0, "required verification tests missing"
          cases = list(root.iter("testcase"))
          modules = {c.get("classname") for c in cases}
          required = {"tests.test_proposition_verification", "tests.test_verification_contract",
                      "tests.test_workflows_verification", "tests.test_verification_release"}
          assert required <= modules, "required verification module collected no tests"
          golden = {c.get("name") for c in cases if c.get("classname") == "tests.test_proposition_verification"}
          expected = {f"test_exact_typed_rules_prove_only_declared_statement[{name}]" for name in
                      ("zero_diagonal", "row_sum", "weighted_squares", "centering_idempotence")}
          expected.update({"test_false_diagonal_formula_has_its_own_checked_witness",
                           "test_centering_dependence_witness_from_enumerated_independent_distribution",
                           "test_instance_covariance_is_not_universal_proof"})
          assert expected <= golden, "required mathematical control missing"
          for key in ("failures", "errors", "skipped"):
              assert sum(int(s.get(key, 0)) for s in suites) == 0, f"required verification {key}"
          PY
      - name: Build sdist and wheel
        # Only after the exact tagged revision's mandatory verification checks.
        # A concurrent green CI badge is not a release prerequisite.
        if: success()
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes "See CHANGELOG.md for changes in this release."
